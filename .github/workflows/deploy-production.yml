name: Deploy - Production

on:
  workflow_dispatch:

permissions:
  actions: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: Production # used to access the vars.* below
      deployment: false
    env:
      BUILD_WORKFLOW_FILE: build.yml
      SOURCE_BRANCH: main # ensures that we deploy artifacts from the main branch only, not from the branch that triggered this workflow, not from the PR build, etc.
      ARTIFACT_NAMES: '["PublicNuGets", "DocumentationWeb", "DocumentationMcp"]'
    steps:
    # Resolves the LATEST run of the build workflow on the source branch (any status, PR runs excluded)
    # and requires it to be completed successfully. A newer failed, cancelled or still running build
    # stops the deployment instead of silently deploying an older successful build.
    # All artifacts are then downloaded from this single run (consistent set by construction).
    - name: Resolve artifact source build
      id: resolve-source
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPOSITORY: ${{ github.repository }}
      run: |
        $ErrorActionPreference = 'Stop'
        $names = @($env:ARTIFACT_NAMES | ConvertFrom-Json)

        # 'branch' filter matches head_branch, which for a pull_request run is the PR source branch,
        # so PR runs are excluded explicitly by event. Pages are read only while no suitable run is found.
        $pullRequestEvents = @('pull_request', 'pull_request_target')
        $branch = [uri]::EscapeDataString($env:SOURCE_BRANCH)
        $pageSize = 30
        $page = 1
        $run = $null
        do {
          $runsJson = gh api "repos/$env:REPOSITORY/actions/workflows/$env:BUILD_WORKFLOW_FILE/runs?branch=$branch&per_page=$pageSize&page=$page"
          if ($LASTEXITCODE -ne 0) { throw "Listing runs of workflow '$env:BUILD_WORKFLOW_FILE' (branch '$env:SOURCE_BRANCH') failed (exit code $LASTEXITCODE)." }
          $runs = @(($runsJson | ConvertFrom-Json).workflow_runs)
          $run = $runs | Where-Object { $pullRequestEvents -notcontains $_.event } | Select-Object -First 1
          $page++
        } while (-not $run -and $runs.Count -eq $pageSize -and $page -le 10)

        if (-not $run) {
          Write-Host "::error::There is no run of workflow '$env:BUILD_WORKFLOW_FILE' on branch '$env:SOURCE_BRANCH' (pull request runs do not count) - nothing to deploy."
          exit 1
        }

        $runUrl = "https://github.com/$env:REPOSITORY/actions/runs/$($run.id)"
        $commitUrl = "https://github.com/$env:REPOSITORY/commit/$($run.head_sha)"

        # Completed = status 'completed' + conclusion ('success', 'failure', 'cancelled', 'timed_out', ...);
        # not finished = status 'queued'/'in_progress'/'waiting' and conclusion null.
        if (-not ($run.status -eq 'completed' -and $run.conclusion -eq 'success')) {
          $isRunning = $run.status -ne 'completed'
          $state = if ($isRunning) { "is still running (status '$($run.status)')" } else { "finished with conclusion '$($run.conclusion)'" }
          $hint = if ($isRunning) { 'Wait for it to finish and run the deployment again.' } else { 'Fix the build (or re-run it) and run the deployment again.' }
          Write-Host "::error::The latest build of branch '$env:SOURCE_BRANCH' (run #$($run.run_number)) $state - deployment stopped to avoid silently deploying an older build. $hint See job summary for details."
          @(
            '## :no_entry: Deployment stopped - the latest build is not successful'
            ''
            "Only a build that is the latest build of the branch gets deployed. The latest build $state."
            ''
            '| | |'
            '|---|---|'
            "| Workflow | ``$env:BUILD_WORKFLOW_FILE`` |"
            "| Branch | ``$env:SOURCE_BRANCH`` |"
            "| Run | [#$($run.run_number)]($runUrl) (run_id $($run.id)) |"
            "| State | ``$($run.status)`` / ``$($run.conclusion)`` |"
            "| Commit | [$($run.head_sha.Substring(0, 7))]($commitUrl) |"
            "| Triggered | $($run.created_at) (``$($run.event)``, $($run.actor.login)) |"
            ''
            $hint
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          exit 1
        }
        Write-Host "Source build: run_id $($run.id), run_number $($run.run_number), commit $($run.head_sha), completed $($run.updated_at)"

        # Verify artifacts exist BEFORE downloading - actions/download-artifact only logs a warning for an unknown id.
        $artifactIds = @()
        $missing = @()
        foreach ($name in $names) {
          $artifactsJson = gh api "repos/$env:REPOSITORY/actions/runs/$($run.id)/artifacts?name=$([uri]::EscapeDataString($name))&per_page=100"
          if ($LASTEXITCODE -ne 0) { throw "Listing artifacts of run $($run.id) failed (exit code $LASTEXITCODE)." }
          $artifact = @(($artifactsJson | ConvertFrom-Json).artifacts | Where-Object { $_.name -ceq $name -and -not $_.expired }) | Select-Object -First 1
          if ($artifact) {
            Write-Host "Artifact '$name': id $($artifact.id), $([math]::Round($artifact.size_in_bytes / 1MB, 1)) MB"
            $artifactIds += $artifact.id
          } else {
            $missing += $name
          }
        }
        if ($missing.Count -gt 0) {
          Write-Host "::error::Build run $($run.id) does not contain the required artifacts: $($missing -join ', ')."
          exit 1
        }

        "[Artifacts Build]($runUrl)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
        "[Artifacts Commit]($commitUrl)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

        "run_id=$($run.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "head_sha=$($run.head_sha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "artifact_ids=$($artifactIds -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    # With multiple artifact ids, download-artifact extracts each one into 'a/<artifact name>/'.
    - name: Download artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        run-id: ${{ steps.resolve-source.outputs.run_id }}
        artifact-ids: ${{ steps.resolve-source.outputs.artifact_ids }}
        path: a

    # download-artifact only logs a warning for an artifact it could not download - verify the result.
    - name: Verify downloaded artifacts
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $missing = @($env:ARTIFACT_NAMES | ConvertFrom-Json) | Where-Object { -not (Test-Path -Path "a/$_" -PathType Container) -or -not (Get-ChildItem -Path "a/$_" -Force | Select-Object -First 1) }
        if ($missing.Count -gt 0) {
          Write-Host "::error::Downloaded artifacts are missing or empty: $($missing -join ', ')."
          exit 1
        }
        Get-ChildItem -Path a -Recurse -File | ForEach-Object { $_.FullName }

    # to configure NuGet Trusted Publishing, see https://www.nuget.org/account/trustedpublishing
    - name: NuGet login (Trusted Publishing)
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ vars.NUGET_TRUSTED_PUBLISHING_USER }}

    - name: Publish NuGet packages to nuget.org
      shell: pwsh
      run: |
        Get-ChildItem -Path ./a/PublicNuGets -Filter *.nupkg -Recurse | ForEach-Object {
          dotnet nuget push $_.FullName --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        }

    - name: Azure login
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        tenant-id: ${{ vars.AZURE_HAVIT_TENANTID }}
        subscription-id: ${{ vars.AZURE_HAVITINTERNAL_SUBSCRIPTIONID }}
        client-id: ${{ vars.AZURE_HAVIT_GITHUBDEPLOYMENTAPP_CLIENTID }}

    - name: Deploy DocumentationWeb to Azure App Service
      uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
      with:
        app-name: HavitBlazorWeb
        package: a/DocumentationWeb/DocumentationWeb.zip

    - name: Deploy DocumentationMcp to Azure App Service
      uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
      with:
        app-name: HavitBlazorMcp
        package: a/DocumentationMcp/DocumentationMcp.zip
