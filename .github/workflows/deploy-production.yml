name: Deploy - Production

on:
  workflow_dispatch:

permissions:
  actions: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: Production # used to access the vars.* below
      deployment: false
    steps:
    - name: Create artifacts folder
      run: mkdir a

    - name: Download artifact - PublicNuGets
      uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        workflow: build.yml
        workflow_conclusion: success
        branch: main # ensures that we download artifacts from the main branch only, not from the branch that triggered this workflow, not from the PR build, etc.
        name: PublicNuGets
        path: a/PublicNuGets

    - name: Download artifact - DocumentationWeb
      uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        workflow: build.yml
        workflow_conclusion: success
        branch: main
        name: DocumentationWeb
        path: a/DocumentationWeb

    - name: Download artifact - DocumentationMcp
      uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        workflow: build.yml
        workflow_conclusion: success
        branch: main
        name: DocumentationMcp
        path: a/DocumentationMcp

    # to configure NuGet Trusted Publishing, see https://www.nuget.org/account/trustedpublishing
    - name: NuGet login (Trusted Publishing)
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ vars.NUGET_TRUSTED_PUBLISHING_USER }}

    - name: Publish NuGet packages to nuget.org
      shell: pwsh
      run: |
        Get-ChildItem -Path ./a/PublicNuGets -Filter *.nupkg -Recurse | ForEach-Object {
          dotnet nuget push $_.FullName --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        }

    - name: Azure login
      uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
      with:
        tenant-id: ${{ vars.AZURE_HAVIT_TENANTID }}
        subscription-id: ${{ vars.AZURE_HAVITINTERNAL_SUBSCRIPTIONID }}
        client-id: ${{ vars.AZURE_HAVIT_GITHUBDEPLOYMENTAPP_CLIENTID }}

    - name: Deploy DocumentationWeb to Azure App Service
      uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
      with:
        app-name: HavitBlazorWeb
        package: a/DocumentationWeb/DocumentationWeb.zip

    - name: Deploy DocumentationMcp to Azure App Service
      uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
      with:
        app-name: HavitBlazorMcp
        package: a/DocumentationMcp/DocumentationMcp.zip

