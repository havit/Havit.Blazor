name: Build
run-name: "Build | #${{ github.run_number }}${{ github.event_name == 'schedule' && ' [Scheduled]' || (github.event_name == 'pull_request' && ' [PullRequest]' || '') }}"

on:
  push:
    branches: [ main, v6 ]
  pull_request:
    branches: [ main, v6 ]
  schedule:
    # Sunday 07:00 Europe/Prague
    - cron: '0 7 * * 0'
      timezone: "Europe/Prague"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
  packages: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        path: s
        #ref: ${{ (github.event_name == 'schedule' && inputs.scheduled-build-ref) || '' }} # scheduled build always checks out the main branch (default)

    - name: Create artifacts folder
      run: mkdir a

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('s/Directory.Packages.props', 's/**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore dependencies
      working-directory: s
      run: dotnet restore

    - name: Build solution
      working-directory: s
      run: dotnet build --no-restore -c Release -p:ContinuousIntegrationBuild=true -p:PublishDirectory=${{ github.workspace }}/a

    - name: Publish Documentation.Server
      working-directory: s
      run: dotnet publish Havit.Blazor.Documentation.Server/Havit.Blazor.Documentation.Server.csproj --no-restore -c Release -p:ContinuousIntegrationBuild=true -p:PublishDirectory=${{ github.workspace }}/a

    - name: Publish Documentation.Mcp
      working-directory: s
      run: dotnet publish Havit.Blazor.Documentation.Mcp/Havit.Blazor.Documentation.Mcp.csproj --no-restore -c Release -p:ContinuousIntegrationBuild=true -p:PublishDirectory=${{ github.workspace }}/a

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~\AppData\Local\ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('s/Directory.Packages.props') }}

    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      working-directory: s
      run: pwsh Havit.Blazor.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps

    - name: Install Playwright system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      working-directory: s
      run: pwsh Havit.Blazor.E2ETests/bin/Release/net10.0/playwright.ps1 install-deps

    - name: Run unit tests
      id: run-unit-tests
      working-directory: s
      run: dotnet test --no-build -c Release --verbosity normal --report-trx --results-directory ${{ runner.temp }}/test-results --ignore-exit-code "1;8"

    - name: Publish test report
      if: ${{ !cancelled() && steps.run-unit-tests.conclusion != 'skipped' }}
      uses: jirikanda/test-reporter@dbe114e2028c31b2946d2c74aeb4bf26910b54f0 # fork of dorny/test-reporter that can strip paths from TRX file names in the report
      with:
        name: Test Report
        path: ${{ runner.temp }}/test-results/**/*.trx
        reporter: dotnet-trx
        report-title: 'Test Report'
        list-suites: 'failed' # only test classes with failed tests
        list-tests: 'failed' # only failed tests
        max-annotations: 50
        fail-on-error: 'false'
        fail-on-empty: 'false'
        working-directory: s
        path-replace-backslashes: true
        file-name-only: true # not a property of dorny/test-reporter, but of jirikanda/test-reporter

    - name: Upload artifacts - PublicNuGets
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: PublicNuGets
        path: a/PublicNuGets
        compression-level: 0

    - name: Upload artifact - DocumentationWeb
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: DocumentationWeb
        path: a/DocumentationWeb
        compression-level: 0

    - name: Upload artifact - DocumentationMcp
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: DocumentationMcp
        path: a/DocumentationMcp
        compression-level: 0

    # Havit.Blazor.Documentation/XmlDoc/*.xml is copied there by the library builds above (CopyCustomContent target),
    # docs/generated is written by Havit.Blazor.Documentation.RepoDumpGenerator. Both are committed, so fail when they are stale.
    # Kept at the end of the job so that a stale file does not hide test results or artifacts.
    - name: Generate docs/generated
      working-directory: s
      run: dotnet run --project Havit.Blazor.Documentation.RepoDumpGenerator/Havit.Blazor.Documentation.RepoDumpGenerator.csproj --no-build -c Release

    - name: Check generated documentation files are up to date
      working-directory: s
      run: |
        $changes = git status --porcelain --untracked-files=all -- Havit.Blazor.Documentation/XmlDoc docs/generated
        if ($changes) {
          $changes
          Write-Output "::error::Havit.Blazor.Documentation/XmlDoc or docs/generated is out of date. Build the solution, run 'dotnet run --project Havit.Blazor.Documentation.RepoDumpGenerator' and commit the changes."
          exit 1
        }

  bootstrap-assets:
    # Fails when the committed Bootstrap build output (Havit.Bootstrap/dist, Havit.Blazor.Components.Web.Bootstrap/wwwroot/bootstrap.*)
    # does not match what Havit.Bootstrap builds from its sources.
    # Runs on Linux: the CSS source maps embed the SCSS sources, so a Windows (CRLF) checkout would produce different maps.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        path: s

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 22.x
        cache: npm
        cache-dependency-path: s/Havit.Bootstrap/package-lock.json

    - name: Install Havit.Bootstrap dependencies
      working-directory: s/Havit.Bootstrap
      run: npm ci

    - name: Build Bootstrap CSS
      working-directory: s/Havit.Bootstrap
      run: npm run css

    - name: Copy Bootstrap CSS and JS bundle to Havit.Blazor.Components.Web.Bootstrap
      working-directory: s/Havit.Bootstrap
      run: npm run publish-to-blazor

    - name: Check Bootstrap files are up to date
      working-directory: s
      run: |
        changes=$(git status --porcelain --untracked-files=all -- Havit.Bootstrap/dist 'Havit.Blazor.Components.Web.Bootstrap/wwwroot/bootstrap.*')
        if [ -n "$changes" ]; then
          echo "$changes"
          echo "::error::Bootstrap build output is out of date. In Havit.Bootstrap run 'npm ci', 'npm run css' and 'npm run publish-to-blazor', then commit the changes."
          exit 1
        fi
